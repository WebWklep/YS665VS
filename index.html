<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOUR SWEET SIX SIX FIVE VISUAL STUDIO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#171717;font-family:Arial,Helvetica,sans-serif}.page{max-width:1040px;margin:auto;padding:0 40px}header{padding:25px 0 22px;border-bottom:1px solid #ededed}h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.045em}main{padding:42px 0}.view{display:none}.view.active{display:block}.cap{font:9px "Courier New",monospace;color:#aaa;letter-spacing:.08em;margin:0 0 12px}ul{list-style:none;padding:0;margin:0}li{border-bottom:1px solid #ededed;max-width:520px}.row{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 0;border:0;background:none;text-align:left;font-size:13px;font-weight:400;cursor:pointer}.row:hover{color:#777}.num{font:9px "Courier New",monospace;color:#bbb}.back{border:0;background:none;padding:0;margin:0 0 28px;color:#888;font:10px "Courier New",monospace;cursor:pointer}.sub .row{font-size:12px}.tools{margin:0 0 20px}.add{border:1px solid #ddd;background:white;padding:9px 12px;font:10px "Courier New",monospace;cursor:pointer}.stage{height:min(52vw,480px);min-height:300px;border:1px solid #e8e8e8;position:relative;overflow:hidden;perspective:1100px;display:flex;align-items:center;justify-content:center}.empty{font-size:12px;color:#aaa}.carousel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform-style:preserve-3d}.slide{position:absolute;width:min(30vw,300px);height:min(39vw,360px);max-height:78%;border:1px solid #e6e6e6;background:#f5f5f5;overflow:hidden;transition:transform .6s cubic-bezier(.2,.75,.2,1),opacity .5s;cursor:pointer}.slide img{width:100%;height:100%;object-fit:cover;pointer-events:none}.controls{position:absolute;bottom:13px;display:flex;align-items:center;gap:14px}.arrow{width:30px;height:30px;border:1px solid #ddd;border-radius:50%;background:white;cursor:pointer}.count,.library-title{font:10px "Courier New",monospace;color:#999}.count{min-width:45px;text-align:center}.library{padding-top:17px}.library-title{margin-bottom:12px}.thumbs{display:flex;gap:8px;overflow-x:auto;padding:3px 2px 12px;min-height:83px}.thumb{position:relative;flex:0 0 70px;height:68px;border:1px solid #e5e5e5;background:#f5f5f5;padding:0;cursor:grab}.thumb img{width:100%;height:100%;object-fit:cover;pointer-events:none}.thumb.active{outline:1px solid #111;outline-offset:2px}.remove{position:absolute;right:2px;top:2px;width:16px;height:16px;padding:0;border:0;background:white;font-size:12px;cursor:pointer}.render{margin-top:12px;padding:10px 14px;background:#171717;color:white;border:0;font:10px "Courier New",monospace;cursor:pointer}.render:disabled{opacity:.3}footer{border-top:1px solid #ededed;padding:13px 0 20px;font:8px "Courier New",monospace;color:#ccc}@media(max-width:650px){.page{padding:0 20px}header{padding:22px 0}h1{font-size:16px}main{padding:35px 0}.stage{height:390px;min-height:280px}.slide{width:57vw;height:68%}}
</style></head><body><div class="page"><header><h1>YOUR SWEET SIX SIX FIVE VISUAL STUDIO</h1></header><main>
<section id="home" class="view active"><p class="cap">ГЛАВНАЯ</p><ul><li><button class="row" id="open"><span>Анимашка</span><span class="num">01</span></button></li></ul></section>
<section id="anim" class="view"><button class="back" id="back">← ГЛАВНАЯ</button><p class="cap">АНИМАШКА</p><ul class="sub"><li><button class="row" id="template"><span>3D-карусель</span><span class="num">01</span></button></li></ul></section>
<section id="carousel-view" class="view"><button class="back" id="back2">← АНИМАШКА</button><p class="cap">3D-КАРУСЕЛЬ</p><div class="tools"><button class="add" id="add">＋ ДОБАВИТЬ ФОТО</button><input id="files" type="file" accept="image/*" multiple hidden></div><div class="stage" id="stage"><div class="empty" id="empty">＋</div><div class="carousel" id="carousel"></div><div class="controls"><button class="arrow" id="prev">←</button><span class="count" id="count">0 / 0</span><button class="arrow" id="next">→</button></div></div><div class="library"><div class="library-title">ИЗОБРАЖЕНИЯ</div><div class="thumbs" id="thumbs"></div></div><button class="render" id="render" disabled>РЕНДЕР →</button></section></main><footer>YS665VS</footer></div>
<script>
const $=id=>document.getElementById(id);let items=[],active=0,drag=null;function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id))}$('open').onclick=()=>show('anim');$('back').onclick=()=>show('home');$('template').onclick=()=>show('carousel-view');$('back2').onclick=()=>show('anim');$('add').onclick=()=>$('files').click();$('files').onchange=e=>{[...e.target.files].filter(f=>f.type.startsWith('image/')).forEach(f=>items.push({url:URL.createObjectURL(f)}));active=items.length-1;draw();e.target.value=''};
function draw(){let c=$('carousel');c.innerHTML='';items.forEach((it,i)=>{let d=i-active,n=Math.abs(d),el=document.createElement('div');el.className='slide';el.style.transform='translateX('+(d*175)+'px) translateZ('+(-n*105)+'px) rotateY('+(d*-32)+'deg) scale('+Math.max(.68,1-n*.12)+')';el.style.opacity=n>3?0:1-n*.16;el.style.zIndex=10-n;let im=document.createElement('img');im.src=it.url;el.appendChild(im);el.onclick=()=>{active=i;draw()};c.appendChild(el)});$('empty').style.display=items.length?'none':'block';$('count').textContent=items.length?(active+1)+' / '+items.length:'0 / 0';$('render').disabled=!items.length;let t=$('thumbs');t.innerHTML='';items.forEach((it,i)=>{let b=document.createElement('button');b.className='thumb'+(i===active?' active':'');b.draggable=true;b.dataset.i=i;let im=document.createElement('img');im.src=it.url;b.appendChild(im);let x=document.createElement('button');x.className='remove';x.textContent='×';x.onclick=e=>{e.stopPropagation();URL.revokeObjectURL(items[i].url);items.splice(i,1);active=Math.min(active,Math.max(0,items.length-1));draw()};b.appendChild(x);b.onclick=()=>{active=i;draw()};b.ondragstart=e=>{drag=i;e.dataTransfer.effectAllowed='move'};b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();let to=+b.dataset.i;if(drag===null||drag===to)return;let v=items.splice(drag,1)[0];items.splice(to,0,v);if(active===drag)active=to;else if(drag<active&&to>=active)active--;else if(drag>active&&to<=active)active++;drag=null;draw()};t.appendChild(b)})}
function move(n){if(items.length){active=(active+n+items.length)%items.length;draw()}}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);let sx=0;$('stage').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});$('stage').addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>45)move(d<0?1:-1)},{passive:true});$('render').onclick=()=>{if(!items.length)return;let w=window.open('','_blank');if(w)w.document.write('<html><body style="margin:0;height:100vh;display:grid;place-items:center"><img style="max-width:95vw;max-height:95vh" src="'+items[active].url+'"></body></html>')};document.addEventListener('keydown',e=>{if($('carousel-view').classList.contains('active')){if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)}});
</script></body></html>
