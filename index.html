<script>
const $=id=>document.getElementById(id);let items=[],active=0,drag=null;function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id))}$('switch-to-editorial').onclick=()=>{show('editorial-view');renderEditorialAssets()};$('switch-to-carousel').onclick=()=>show('carousel-view');$('open').onclick=()=>show('anim');$('open-editorial').onclick=()=>{show('editorial-view');renderEditorialAssets()};$('editorial-home').onclick=()=>show('home');$('crumb-home').onclick=()=>show('home');$('template').onclick=()=>{show('carousel-view');setRatio(ratio.value)};$('crumb-home-2').onclick=()=>show('home');$('crumb-anim').onclick=()=>show('anim');$('add').onclick=()=>$('files').click();$('files').onchange=e=>{[...e.target.files].filter(f=>f.type.startsWith('image/')).forEach(f=>items.push({url:URL.createObjectURL(f)}));active=items.length-1;draw();renderEditorialAssets();e.target.value=''};
let imageMode='square',draggedIndex=null,pointerDrag=null;

function reorder(from,to){if(from===null||to===null||from===to)return;let v=items.splice(from,1)[0];items.splice(to,0,v);if(active===from)active=to;else if(from<active&&to>=active)active--;else if(from>active&&to<=active)active++;draw()}
function draw(){let c=$('carousel');c.innerHTML='';items.forEach((it,i)=>{let d=i-active,n=Math.abs(d),el=document.createElement('div');el.className='slide';el.style.transform='translateX('+(d*175)+'px) translateZ('+(-n*105)+'px) rotateY('+(d*-32)+'deg) scale('+Math.max(.68,1-n*.12)+')';el.style.opacity=n>3?0:1-n*.16;el.style.zIndex=10-n;let im=document.createElement('img');im.src=it.url;im.onload=()=>{let maxW=Math.min(window.innerWidth*.3,300),maxH=$('stage').clientHeight*.78;if(imageMode==='original'){let scale=Math.min(maxW/im.naturalWidth,maxH/im.naturalHeight);el.style.width=(im.naturalWidth*scale)+'px';el.style.height=(im.naturalHeight*scale)+'px';el.style.aspectRatio=im.naturalWidth+'/'+im.naturalHeight}else{let side=Math.min(maxW,maxH);el.style.width=side+'px';el.style.height=side+'px'}};el.appendChild(im);el.onclick=()=>{active=i;draw()};c.appendChild(el)});$('empty').style.display=items.length?'none':'block';$('stage').classList.toggle('empty-state',items.length===0);$('count').textContent=items.length?(active+1)+' / '+items.length:'0 / 0';let t=$('thumbs');t.innerHTML='';items.forEach((it,i)=>{let b=document.createElement('div');b.className='thumb'+(i===active?' active':'');b.draggable=true;b.dataset.i=i;let im=document.createElement('img');im.src=it.url;b.appendChild(im);let x=document.createElement('button');x.className='remove';x.textContent='×';x.setAttribute('aria-label','Удалить фото');x.onclick=e=>{e.stopPropagation();URL.revokeObjectURL(items[i].url);items.splice(i,1);active=Math.min(active,Math.max(0,items.length-1));draw()};b.appendChild(x);b.onclick=()=>{if(b.dataset.moved)return;active=i;draw()};b.ondragstart=e=>{draggedIndex=i;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(i));b.classList.add('dragging')};b.ondragend=()=>{draggedIndex=null;b.classList.remove('dragging')};b.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move'};b.ondrop=e=>{e.preventDefault();let from=draggedIndex===null?Number(e.dataTransfer.getData('text/plain')):draggedIndex;reorder(from,i);draggedIndex=null};b.onpointerdown=e=>{if(e.pointerType==='mouse')return;pointerDrag={from:i,x:e.clientX,y:e.clientY};};b.onpointerup=e=>{if(!pointerDrag||e.pointerType==='mouse')return;let p=pointerDrag;pointerDrag=null;if(Math.hypot(e.clientX-p.x,e.clientY-p.y)<12)return;let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.thumb');if(target)reorder(p.from,Number(target.dataset.i))};b.onpointercancel=()=>{pointerDrag=null};t.appendChild(b)})}

/* Editorial mode shares the carousel's project image collection. */
let editorialImage=null, editorialObjects=[], selectedText=null, activePointer=null;
const edCanvas=$('editorial-canvas');

function renderEditorialText(){edCanvas.querySelectorAll('.editorial-text').forEach(n=>n.remove());editorialObjects.forEach(o=>{const el=document.createElement('div');el.className='editorial-text'+(o.kind==='caption'?' caption':'')+(o.id===selectedText?' selected':'');el.dataset.id=o.id;el.textContent=o.text;el.style.left=o.x+'%';el.style.top=o.y+'%';el.style.fontSize=o.size+'px';el.style.fontFamily=o.font+', Arial, sans-serif';el.style.fontWeight=o.weight;el.style.fontStyle=o.italic?'italic':'normal';el.style.textAlign=o.align;el.addEventListener('pointerdown',e=>{if(e.target.classList.contains('resize-handle'))return;e.preventDefault();selectEditorialText(o.id);activePointer={id:o.id,startX:e.clientX,startY:e.clientY,originX:o.x,originY:o.y,mode:'move'};el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!activePointer||activePointer.id!==o.id||activePointer.mode!=='move')return;const r=edCanvas.getBoundingClientRect();o.x=Math.max(0,Math.min(90,activePointer.originX+(e.clientX-activePointer.startX)/r.width*100));o.y=Math.max(0,Math.min(95,activePointer.originY+(e.clientY-activePointer.startY)/r.height*100));el.style.left=o.x+'%';el.style.top=o.y+'%'});el.addEventListener('pointerup',()=>activePointer=null);el.addEventListener('pointercancel',()=>activePointer=null);if(o.id===selectedText){const h=document.createElement('span');h.className='resize-handle';h.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();activePointer={id:o.id,startX:e.clientX,startY:e.clientY,originSize:o.size,mode:'resize'};h.setPointerCapture(e.pointerId)});h.addEventListener('pointermove',e=>{if(!activePointer||activePointer.id!==o.id||activePointer.mode!=='resize')return;o.size=Math.max(10,Math.min(180,activePointer.originSize+(e.clientX-activePointer.startX)*.65));el.style.fontSize=o.size+'px'});h.addEventListener('pointerup',()=>activePointer=null);h.addEventListener('pointercancel',()=>activePointer=null);el.appendChild(h)}edCanvas.appendChild(el)});}
function selectEditorialText(id){selectedText=id;const o=editorialObjects.find(x=>x.id===id);renderEditorialText();if(!o)return;$('font-choice').value=o.font;$('style-regular').classList.toggle('active',o.weight===400&&!o.italic);$('style-bold').classList.toggle('active',o.weight===700&&!o.italic);$('style-italic').classList.toggle('active',o.italic);['left','center','right'].forEach(a=>$('align-'+a).classList.toggle('active',o.align===a));}

$('editorial-upload').onclick=()=>$('editorial-files').click();$('editorial-files').onchange=e=>{[...e.target.files].filter(f=>f.type.startsWith('image/')).forEach(f=>items.push({url:URL.createObjectURL(f)}));if(items.length){editorialImage=items.length-1;setEditorialImage(editorialImage);draw()}e.target.value='';renderEditorialAssets()};
$('add-headline').onclick=()=>addEditorialText('headline');$('add-caption').onclick=()=>addEditorialText('caption');

function move(n){if(items.length){active=(active+n+items.length)%items.length;draw()}}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);const ratio=$('ratio'),orientation=$('orientation');function setRatio(v){ratio.value=v;const [rw,rh]=v.split('/').map(Number);const stage=$('stage');const available=stage.parentElement.clientWidth;if(!available){orientation.querySelector('.orientation-icon').textContent=rw<rh?'▯':'▭';return}const h=Math.min(480,window.innerHeight*.72);const w=Math.min(available,h*rw/rh);stage.style.width=w+'px';stage.style.height=(w*rh/rw)+'px';stage.style.aspectRatio=rw+'/'+rh;orientation.querySelector('.orientation-icon').textContent=rw<rh?'▯':'▭';draw()}ratio.onchange=()=>setRatio(ratio.value);orientation.onclick=()=>{let [w,h]=ratio.value.split('/').map(Number);let next=w<h?`${h}/${w}`:`${h}/${w}`;if(![...ratio.options].some(o=>o.value===next)){next='9/16'}setRatio(next)};setRatio('16/9');window.addEventListener('resize',()=>setRatio(ratio.value));let sx=0;$('stage').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});$('stage').addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>45)move(d<0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if($('carousel-view').classList.contains('active')){if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)}});
</script></body></html>
