<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#171717;font-family:Arial,Helvetica,sans-serif}.page{max-width:1040px;margin:auto;padding:0 40px}header{padding:25px 0 18px}h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.045em}main{padding:0 0 42px}.view{display:none}.view.active{display:block}.path{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:30px;margin:0 0 27px;padding:5px 9px;border:1px solid #e1e1e1}.path button{border:0;background:none;color:#777;padding:0;font:10px "Courier New",monospace;letter-spacing:0;line-height:1;cursor:pointer}.path button.current{color:#171717;font-weight:700}.path button:disabled{cursor:default}.path .sep{color:#aaa;font:10px Arial,sans-serif;line-height:1}ul{list-style:none;padding:0;margin:0}li{border-bottom:1px solid #ededed;max-width:520px}.row{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 0;border:0;background:none;text-align:left;font-size:13px;font-weight:400;cursor:pointer}.row:hover{color:#777}.num{font:9px "Courier New",monospace;color:#bbb}.back{border:0;background:none;padding:0;margin:0 0 28px;color:#888;font:10px "Courier New",monospace;cursor:pointer}.sub .row{font-size:12px}.tools{margin:0 0 20px}.add{width:46px;height:46px;border:1px solid #d8d8d8;border-radius:50%;background:#fff;color:#444;padding:0;font:25px Arial,sans-serif;font-weight:300;line-height:1;cursor:pointer;display:grid;place-items:center}.add:hover{border-color:#999}.stage{width:100%;height:480px;max-height:none;min-height:0;aspect-ratio:16/9;margin:0 auto;border:1px solid #e8e8e8;position:relative;overflow:hidden;perspective:1100px;display:flex;align-items:center;justify-content:center;transition:width .2s,height .2s}.empty{font-size:12px;color:#aaa}.carousel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform-style:preserve-3d}.slide{position:absolute;width:min(30vw,300px);height:min(39vw,360px);max-height:78%;border:1px solid #e6e6e6;background:#f5f5f5;overflow:hidden;transition:transform .6s cubic-bezier(.2,.75,.2,1),opacity .5s;cursor:pointer}.slide img{width:100%;height:100%;object-fit:cover;pointer-events:none}.stage.original-mode .slide{height:auto;aspect-ratio:var(--image-ratio,1/1);max-height:78%;width:min(30vw,300px)}.stage.original-mode .slide img{object-fit:contain}.stage.square-mode .slide{width:min(30vw,300px);height:auto;aspect-ratio:1/1;max-height:78%}.stage.square-mode .slide img{object-fit:cover}.preview-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px;padding-top:7px}.controls{display:flex;align-items:center;gap:8px}.ratio-tools{display:flex;align-items:center;gap:5px}.crop-modes{display:flex;align-items:center;margin-right:5px}.crop-mode{height:27px;padding:0 8px;border:1px solid #dedede;border-right:0;background:#fff;color:#777;font:9px "Courier New",monospace;cursor:pointer}.crop-mode:last-child{border-right:1px solid #dedede}.crop-mode.active{background:#222;color:#fff;border-color:#222}.orientation{width:29px;height:27px;border:1px solid #dedede;background:#fff;color:#555;display:grid;place-items:center;cursor:pointer;padding:0}.orientation-icon{font:16px Arial,sans-serif;line-height:1}#ratio{height:27px;min-width:72px;border:1px solid #dedede;border-radius:0;background:#fff;color:#555;padding:0 7px;font:10px "Courier New",monospace;cursor:pointer}.arrow{width:30px;height:30px;border:1px solid #ddd;border-radius:50%;background:white;cursor:pointer}.count{font:10px "Courier New",monospace;color:#999}.library-title{font:10px Arial,Helvetica,sans-serif;color:#999;text-transform:none;letter-spacing:0}.count{min-width:45px;text-align:center}.library{padding-top:17px}.library-title{margin-bottom:12px}.thumbs{display:flex;gap:8px;overflow-x:auto;padding:3px 2px 12px;min-height:83px}.thumb{position:relative;flex:0 0 70px;height:68px;border:1px solid #e5e5e5;background:#f5f5f5;padding:0;cursor:grab}.thumb img{width:100%;height:100%;object-fit:cover;pointer-events:none}.thumb.active{outline:1px solid #111;outline-offset:2px}.thumb.dragging{opacity:.35}.thumb{touch-action:pan-y;user-select:none}.remove{position:absolute;right:2px;top:2px;width:16px;height:16px;padding:0;border:0;background:white;font-size:12px;cursor:pointer}footer{border-top:1px solid #ededed;padding:13px 0 20px;font:8px "Courier New",monospace;color:#ccc}@media(max-width:650px){.page{padding:0 20px}header{padding:22px 0}h1{font-size:16px}main{padding:35px 0}.stage{height:auto;min-height:0}.slide{width:57vw;height:68%}}
</style></head><body><div class="page"><header><h1>YOUR SWEET SIX SIX FIVE VISUAL STUDIO</h1></header><main>
<section id="home" class="view active"><nav class="path" aria-label="Путь"><button class="current" disabled>ГЛАВНАЯ</button></nav><ul><li><button class="row" id="open"><span>Анимашка</span><span class="num">01</span></button></li></ul></section>
<section id="anim" class="view"><nav class="path" aria-label="Путь"><button id="crumb-home">ГЛАВНАЯ</button><span class="sep">→</span><button class="current" disabled>АНИМАШКИ</button></nav><ul class="sub"><li><button class="row" id="template"><span>3D-карусель</span><span class="num">01</span></button></li></ul></section>
<section id="carousel-view" class="view"><nav class="path" aria-label="Путь"><button id="crumb-home-2">ГЛАВНАЯ</button><span class="sep">→</span><button id="crumb-anim">АНИМАШКИ</button><span class="sep">→</span><button class="current" disabled>КАРУСЕЛЬ</button></nav><div class="tools"><button class="add" id="add" aria-label="Добавить фотографии">+</button><input id="files" type="file" accept="image/*" multiple hidden></div><div class="stage square-mode" id="stage"><div class="empty" id="empty">＋</div><div class="carousel" id="carousel"></div></div><div class="preview-bar"><div class="controls"><button class="arrow" id="prev" aria-label="Предыдущее фото">←</button><span class="count" id="count">0 / 0</span><button class="arrow" id="next" aria-label="Следующее фото">→</button></div><div class="ratio-tools"><div class="crop-modes"><button class="crop-mode active" id="crop-square">КВАДРАТ</button><button class="crop-mode" id="crop-original">ОРИГИНАЛ</button></div><button class="orientation" id="orientation" aria-label="Сменить ориентацию" title="Вертикально / горизонтально"><span class="orientation-icon">▯</span></button><select id="ratio" aria-label="Соотношение сторон"><option value="16/9">16:9</option><option value="9/16">9:16</option><option value="4/5">4:5</option><option value="5/4">5:4</option><option value="1/1">1:1</option><option value="3/2">3:2</option><option value="2/3">2:3</option></select></div></div><div class="library"><div class="library-title">img</div><div class="thumbs" id="thumbs"></div></div></section></main><footer>YS665VS</footer></div>
<script>
const $=id=>document.getElementById(id);let items=[],active=0,drag=null;function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id))}$('open').onclick=()=>show('anim');$('crumb-home').onclick=()=>show('home');$('template').onclick=()=>show('carousel-view');$('crumb-home-2').onclick=()=>show('home');$('crumb-anim').onclick=()=>show('anim');$('add').onclick=()=>$('files').click();$('files').onchange=e=>{[...e.target.files].filter(f=>f.type.startsWith('image/')).forEach(f=>items.push({url:URL.createObjectURL(f)}));active=items.length-1;draw();e.target.value=''};
let imageMode='square',draggedIndex=null,pointerDrag=null;
function setImageMode(mode){imageMode=mode;$('stage').classList.toggle('square-mode',mode==='square');$('stage').classList.toggle('original-mode',mode==='original');$('crop-square').classList.toggle('active',mode==='square');$('crop-original').classList.toggle('active',mode==='original');draw()}
$('crop-square').onclick=()=>setImageMode('square');$('crop-original').onclick=()=>setImageMode('original');
function reorder(from,to){if(from===null||to===null||from===to)return;let v=items.splice(from,1)[0];items.splice(to,0,v);if(active===from)active=to;else if(from<active&&to>=active)active--;else if(from>active&&to<=active)active++;draw()}
function draw(){let c=$('carousel');c.innerHTML='';items.forEach((it,i)=>{let d=i-active,n=Math.abs(d),el=document.createElement('div');el.className='slide';el.style.transform='translateX('+(d*175)+'px) translateZ('+(-n*105)+'px) rotateY('+(d*-32)+'deg) scale('+Math.max(.68,1-n*.12)+')';el.style.opacity=n>3?0:1-n*.16;el.style.zIndex=10-n;let im=document.createElement('img');im.src=it.url;im.onload=()=>{let maxW=Math.min(window.innerWidth*.3,300),maxH=$('stage').clientHeight*.78;if(imageMode==='original'){let scale=Math.min(maxW/im.naturalWidth,maxH/im.naturalHeight);el.style.width=(im.naturalWidth*scale)+'px';el.style.height=(im.naturalHeight*scale)+'px';el.style.aspectRatio=im.naturalWidth+'/'+im.naturalHeight}else{let side=Math.min(maxW,maxH);el.style.width=side+'px';el.style.height=side+'px'}};el.appendChild(im);el.onclick=()=>{active=i;draw()};c.appendChild(el)});$('empty').style.display=items.length?'none':'block';$('count').textContent=items.length?(active+1)+' / '+items.length:'0 / 0';let t=$('thumbs');t.innerHTML='';items.forEach((it,i)=>{let b=document.createElement('div');b.className='thumb'+(i===active?' active':'');b.draggable=true;b.dataset.i=i;let im=document.createElement('img');im.src=it.url;b.appendChild(im);let x=document.createElement('button');x.className='remove';x.textContent='×';x.setAttribute('aria-label','Удалить фото');x.onclick=e=>{e.stopPropagation();URL.revokeObjectURL(items[i].url);items.splice(i,1);active=Math.min(active,Math.max(0,items.length-1));draw()};b.appendChild(x);b.onclick=()=>{if(b.dataset.moved)return;active=i;draw()};b.ondragstart=e=>{draggedIndex=i;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(i));b.classList.add('dragging')};b.ondragend=()=>{draggedIndex=null;b.classList.remove('dragging')};b.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move'};b.ondrop=e=>{e.preventDefault();let from=draggedIndex===null?Number(e.dataTransfer.getData('text/plain')):draggedIndex;reorder(from,i);draggedIndex=null};b.onpointerdown=e=>{if(e.pointerType==='mouse')return;pointerDrag={from:i,x:e.clientX,y:e.clientY};};b.onpointerup=e=>{if(!pointerDrag||e.pointerType==='mouse')return;let p=pointerDrag;pointerDrag=null;if(Math.hypot(e.clientX-p.x,e.clientY-p.y)<12)return;let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.thumb');if(target)reorder(p.from,Number(target.dataset.i))};b.onpointercancel=()=>{pointerDrag=null};t.appendChild(b)})}
function move(n){if(items.length){active=(active+n+items.length)%items.length;draw()}}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);const ratio=$('ratio'),orientation=$('orientation');function setRatio(v){ratio.value=v;const [rw,rh]=v.split('/').map(Number);const stage=$('stage');const available=stage.parentElement.clientWidth;const h=Math.min(480,window.innerHeight*.72);const w=Math.min(available,h*rw/rh);stage.style.width=w+'px';stage.style.height=(w*rh/rw)+'px';stage.style.aspectRatio=rw+'/'+rh;orientation.querySelector('.orientation-icon').textContent=rw<rh?'▯':'▭'}ratio.onchange=()=>setRatio(ratio.value);orientation.onclick=()=>{let [w,h]=ratio.value.split('/').map(Number);let next=w<h?`${h}/${w}`:`${h}/${w}`;if(![...ratio.options].some(o=>o.value===next)){next='9/16'}setRatio(next)};setRatio('16/9');window.addEventListener('resize',()=>setRatio(ratio.value));let sx=0;$('stage').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});$('stage').addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>45)move(d<0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if($('carousel-view').classList.contains('active')){if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)}});
</script></body></html>
